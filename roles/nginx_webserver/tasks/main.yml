---
- name: Install Nginx Web Server
  ansible.builtin.package:
    name: nginx
    state: present

- name: Deploy clean default site configuration
  ansible.builtin.copy:
    content: |
      server {
          listen {{ nginx_port }} default_server;
          listen [::]:{{ nginx_port }} default_server;

          root /var/www/html;
          index index.html index.htm;

          server_name _;

          location / {
              try_files $uri $uri/ =404;
          }
      }
    dest: /etc/nginx/sites-available/default
    mode: '0644'

- name: Create a custom landing page con UTF-8
  ansible.builtin.copy:
    content: |
      <!DOCTYPE html>
      <html>
      <head>
          <meta charset="UTF-8">
          <title>Nginx Managed by AWX Roles</title>
          <style>
              body { font-family: sans-serif; text-align: center; margin-top: 50px; background-color: #2c3e50; color: white; }
              h1 { color: #1abc9c; }
          </style>
       </head>
       <body>
           <h1>¡Hola Master Usma! Desplegado con Roles de Ansible</h1>
           <p>Este sitio web se estructuró de forma modular y limpia.</p>
       </body>
       </html>
    dest: /var/www/html/index.html
    mode: '0644'

- name: Ensure Nginx is started and enabled on boot
  ansible.builtin.service:
    name: nginx
    state: restarted
    enabled: true
