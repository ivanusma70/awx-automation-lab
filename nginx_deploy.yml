---
- name: Dedicated Nginx Web Server Deployment
  hosts: all
  gather_facts: true
  tasks:
    - name: Install Nginx Web Server
      ansible.builtin.package:
        name: nginx
        state: present

    - name: Deploy clean default site configuration on port 8085
      ansible.builtin.copy:
        content: |
          server {
              listen 8085 default_server;
              listen [::]:8085 default_server;

              root /var/www/html;
              index index.html index.htm index.nginx-debian.html;

              server_name _;

              location / {
                  try_files $uri $uri/ =404;
              }
          }
        dest: /etc/nginx/sites-available/default
        mode: '0644'
        force: true

    - name: Create a custom landing page
      ansible.builtin.copy:
        content: |
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="UTF-8">
              <title>Nginx Managed by AWX</title>
              <style>
                  body { font-family: sans-serif; text-align: center; margin-top: 50px; background-color: #2c3e50; color: white; }
                  h1 { color: #1abc9c; }
              </style>
          </head>
          <body>
              <h1>¡Hola Ivan! Servidor Nginx Dedicado</h1>
              <p>Desplegado de forma segura en el puerto 8085 sin romper n8n.</p>
              <p>Última sincronización: {{ ansible_date_time.iso8601 }}</p>
          </body>
          </html>
        dest: /var/www/html/index.html
        mode: '0644'

    - name: Ensure Nginx is started and enabled on boot
      ansible.builtin.service:
        name: nginx
        state: restarted
        enabled: true
