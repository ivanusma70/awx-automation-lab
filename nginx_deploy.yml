---
- name: Dedicated Nginx Web Server Deployment
  hosts: all
  gather_facts: true
  tasks:
    - name: Install Nginx Web Server
      ansible.builtin.package:
        name: nginx
        state: present

    - name: Change Nginx default port to 8085 to avoid conflicts with n8n
      ansible.builtin.replace:
        path: /etc/nginx/sites-available/default
        regexp: 'listen 80 default_server;'
        replace: 'listen 8085 default_server;'
      register: nginx_port_config
      failed_when: false

    - name: Ensure IPv6 also listens on 8085
      ansible.builtin.replace:
        path: /etc/nginx/sites-available/default
        regexp: 'listen \[::\]:80 default_server;'
        replace: 'listen \[::\]:8085 default_server;'
      failed_when: false

    - name: Create a custom landing page
      ansible.builtin.copy:
        content: |
          <!DOCTYPE html>
          <html>
          <head>
              <title>Nginx Managed by AWX</title>
              <style>
                  body { font-family: sans-serif; text-align: center; margin-top: 50px; background-color: #2c3e50; color: white; }
                  h1 { color: #1abc9c; }
              </style>
          </head>
          <body>
              <h1>¡Hola Ivan! Servidor Nginx Dedicado</h1>
              <p>Desplegado de forma segura en el puerto 8085.</p>
              <p>Última sincronización: {{ ansible_date_time.iso8601 }}</p>
          </body>
          </html>
        dest: /var/www/html/index.html
        mode: '0644'

    - name: Ensure Nginx is started and enabled on boot
      ansible.builtin.service:
        name: nginx
        state: restarted
        enabled: true
