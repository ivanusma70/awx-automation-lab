---
- name: Check system updates
  hosts: all
  tasks:
    - name: Verify available package updates
      ansible.builtin.dnf:
        list: updates
      register: dnf_updates

    - name: Display pending updates summary
      ansible.builtin.debug:
        msg: >-
          {% for pkg in dnf_updates.results %}
          - {{ pkg.name }} ({{ pkg.version }}-{{ pkg.release }})
          {% endfor %}
